<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="造物所 IDEA KIT：从一个想法开始，把奇思妙想变成真的。">
  <meta name="theme-color" content="#9c7b88">
  <title>造物所 IDEA KIT · 把奇思妙想变成真的</title>
  <style>
    :root{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;background:#9c7b88}
    *{box-sizing:border-box}
    body{margin:0}
    a{color:inherit}
    .hero{position:relative;display:flex;min-height:100svh;flex-direction:column;background:linear-gradient(90deg,rgba(71,44,62,.49),rgba(71,44,62,.1) 68%),url("./assets/hero-dreamscape.png") center/cover no-repeat}
    .hero:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(95,61,77,.28));pointer-events:none}
    header,main,footer{position:relative;z-index:1}
    header{display:flex;align-items:center;justify-content:space-between;padding:clamp(24px,3vw,48px) clamp(26px,4vw,64px)}
    .brand{text-decoration:none;font-size:clamp(26px,2.5vw,42px);font-weight:750;letter-spacing:-.06em;white-space:nowrap}
    .brand span{margin-left:12px;font-size:.52em;font-weight:400;letter-spacing:.24em;vertical-align:middle;opacity:.82}
    nav{display:flex;align-items:center;gap:clamp(18px,2.6vw,42px)}
    nav a{text-decoration:none;font-size:16px;font-weight:600}
    nav a:hover,.secondary:hover{text-decoration:underline;text-underline-offset:5px}
    main{display:flex;flex:1;align-items:center;padding:50px clamp(26px,4vw,64px) 90px}
    .content{max-width:920px}
    .eyebrow{margin:0 0 36px;font-size:clamp(15px,1.2vw,21px);font-weight:700;letter-spacing:.28em}
    h1{max-width:760px;margin:0;font-size:clamp(56px,6vw,100px);font-weight:500;line-height:1.02;letter-spacing:-.065em}
    .subtitle{margin:32px 0 12px;font-size:clamp(25px,2.5vw,40px);line-height:1.3}
    .description{max-width:850px;margin:0;font-size:clamp(19px,1.65vw,28px);line-height:1.65}
    .actions{display:flex;flex-wrap:wrap;align-items:center;gap:32px;margin-top:52px}
    .primary{display:inline-flex;min-height:64px;align-items:center;justify-content:center;border-radius:12px;padding:0 32px;background:#fff;color:#1f2330;text-decoration:none;font-size:20px;font-weight:700}
    .primary:hover{background:#f5e9ed}
    .secondary{font-size:19px;font-weight:600;text-decoration:none}
    footer{padding:0 clamp(26px,4vw,64px) 26px;font-size:14px;line-height:1.5;opacity:.86}
    @media(max-width:680px){header{align-items:flex-start;gap:18px;flex-wrap:wrap}nav{gap:20px}nav a{font-size:14px}.hero{background-position:58% center}main{align-items:flex-end;padding-bottom:58px}.eyebrow{margin-bottom:24px;letter-spacing:.15em}.description{font-size:18px}.actions{gap:22px;margin-top:36px}.primary{min-height:58px;font-size:18px}}
  </style>
</head>
<body>
  <div class="hero">
    <header>
      <a class="brand" href="./" aria-label="造物所首页">造物所<span>IDEA KIT</span></a>
      <nav aria-label="导航">
        <a href="https://zaowusuo-idea-kit.victoriapoter513.chatgpt.site/#/inspiration">灵感集市</a>
        <a href="https://zaowusuo-idea-kit.victoriapoter513.chatgpt.site/#/projects">我的方案</a>
      </nav>
    </header>
    <main>
      <div class="content">
        <p class="eyebrow">YOUR IMAGINATION, ENGINEERED.</p>
        <h1>Make your idea<br>a real thing.</h1>
        <p class="subtitle">把奇思妙想，变成真的。</p>
        <p class="description">从你的想法开始。说出想造什么，我们帮你规划硬件、配齐零件，做成一套真正属于你的科技 DIY Kit。</p>
        <div class="actions">
          <a class="primary" href="https://zaowusuo-idea-kit.victoriapoter513.chatgpt.site/#/design">帮我设计&nbsp; ↗</a>
          <a class="secondary" href="https://zaowusuo-idea-kit.victoriapoter513.chatgpt.site/#/inspiration">先找点灵感 →</a>
        </div>
      </div>
    </main>
    <footer>完整的方案生成、登录与作品功能将在造物所在线站点中打开。</footer>
  </div>
</body>
</html>
